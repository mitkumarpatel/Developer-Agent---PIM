# The [pre-app-build] hooks are auto-generated. Do not remove or manually edit.
hooks:
  pre-app-build: EXTENSION=extensibility/1 npx aio-commerce-lib-app hooks pre-app-build

operations:
  # These worker processes definitions are auto-generated. Do not remove or manually edit.
  workerProcess:
    - type: action
      impl: app-management/app-config
    - type: action
      impl: app-management/association

runtimeManifest:
  packages:
    # This package definition is auto-generated. Do not remove or manually edit.
    app-management:
      license: Apache-2.0
      actions:
        app-config:
          function: .generated/actions/app-management/app-config.js
          web: yes
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
          annotations:
            final: true
            require-adobe-auth: true
        association:
          function: .generated/actions/app-management/association.js
          web: yes
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
          annotations:
            final: true
            require-adobe-auth: true
    pim-product-sync:
      license: Apache-2.0
      actions:
        pim-webhook-receiver:
          function: actions/pim-webhook-receiver/index.js
          web: yes
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            PIM_WEBHOOK_SECRET: $PIM_WEBHOOK_SECRET
          annotations:
            final: true
        sync-product-handler:
          function: actions/sync-product-handler/index.js
          web: yes
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            PIM_WEBHOOK_SECRET: $PIM_WEBHOOK_SECRET
            COMMERCE_BASE_URL: $COMMERCE_BASE_URL
            COMMERCE_AUTH_TYPE: $COMMERCE_AUTH_TYPE
            COMMERCE_ACCESS_TOKEN: $COMMERCE_ACCESS_TOKEN
            COMMERCE_CLIENT_ID: $COMMERCE_CLIENT_ID
            COMMERCE_CLIENT_SECRET: $COMMERCE_CLIENT_SECRET
            COMMERCE_REFRESH_TOKEN: $COMMERCE_REFRESH_TOKEN
          annotations:
            final: true
